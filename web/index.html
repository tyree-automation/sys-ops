<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sys-ops — fleet dashboard</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <h1 id="site-title">sys-ops</h1>
      <p id="site-tagline"></p>
    </div>
  </div>

  <nav class="filters" id="env-filters" aria-label="environment filter"></nav>

  <div class="topbar-tools">
    <input type="search" id="search" placeholder="search nodes…" autocomplete="off">
    <label class="accent-pick" title="accent color">
      <input type="color" id="accent-input">
    </label>
    <button id="theme-toggle" title="toggle light/dark" aria-label="toggle theme">◐</button>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>

  <section class="map-panel" id="map-panel">
    <div id="map"></div>
    <div class="map-legend" id="map-legend"></div>
  </section>

  <section class="panel" id="nodes-panel">
    <h2>nodes</h2>
    <div class="node-grid" id="node-grid"></div>
  </section>

  <section class="panel" id="peering-panel" hidden>
    <h2>peer with me</h2>
    <dl class="kv" id="peering-info"></dl>
  </section>

  <section class="panel" id="dn42-panel">
    <h2>dn42 peerings</h2>
    <div class="table-wrap">
      <table id="dn42-table">
        <thead>
          <tr><th>node</th><th>peer</th><th>ASN</th><th>endpoint</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawer-close" aria-label="close">×</button>
  <div id="drawer-body"></div>
</aside>
<div class="drawer-scrim" id="drawer-scrim"></div>

<footer id="site-footer"></footer>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
