# Fleet inventory — managed by scripts/add-server.py.
# Host IDs are lowercase CLLI codes: place(4) region(2) site(2) entity(3),
# e.g. nycmnydcw01 = New York Manhattan / NY / site DC / web #01.
#
# Besides its role group, a node may join optional COMPONENT groups (these
# turn on extra roles during onboard.yml):
#   dn42      — dn42 router stack (WireGuard + BIRD2); see group_vars/dn42.yml
#               and set per-node dn42_ownip / dn42_peers in host_vars/<node>.yml
#   autopeer  — automatic peering API (requires dn42 on the same node)
#   website   — fleet dashboard (run scripts/build-site.py first)
#
# Manual edits are preserved as data, but YAML comments are rewritten.
# Lifecycle: add -> onboard.yml -> maintenance.yml -> retire -> decommission.yml -> remove
---
all:
  children:
    dn42:
      hosts: {}
    autopeer:
      hosts: {}
    website:
      hosts: {}
    retiring:
      hosts: {}
