---
# Example inventory.
# CLI use:        copy to inventory/hosts.yml and edit (gitignored).
# Semaphore use:  recreate this structure in a Semaphore "Inventory" (static YAML),
#                 or point Semaphore at a file inside the repo.
all:
  children:
    servers:
      hosts:
        web-01:
          ansible_host: 192.168.1.10
        db-01:
          ansible_host: 192.168.1.11
      vars:
        ansible_user: root
        # ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    # Hosts queued for teardown. Move a host here, then run decommission.yml
    # with -e decommission_confirm=WIPE (or limit by hostname).
    retiring:
      hosts: {}
