---
- name: Load OS-family specific chrony settings
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Set timezone
  community.general.timezone:
    name: "{{ time_timezone }}"

- name: Install chrony
  ansible.builtin.package:
    name: chrony
    state: present

- name: Disable systemd-timesyncd so chrony owns time sync
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false

- name: Configure chrony NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ time_chrony_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: "{{ time_chrony_service }}"
    state: started
    enabled: true
