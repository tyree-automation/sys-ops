---
# SSH hardening via /etc/ssh/sshd_config.d/ drop-in.
security_ssh_hardening: true
security_ssh_port: 22
# "no" | "prohibit-password" | "yes"
security_ssh_permit_root_login: "prohibit-password"
# WARNING: only set "no" once key-based access is confirmed working.
security_ssh_password_auth: "no"

# fail2ban brute-force protection.
security_fail2ban: true
security_fail2ban_bantime: "1h"
security_fail2ban_findtime: "10m"
security_fail2ban_maxretry: 5

# Firewall: ufw on Debian family, firewalld on RedHat family.
security_firewall: true
security_firewall_allowed_tcp_ports:
  - "{{ security_ssh_port }}"
security_firewall_allowed_udp_ports:
  - 41641   # tailscale
