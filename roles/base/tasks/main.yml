---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  when: base_manage_hostname | bool

- name: Refresh apt cache (Debian family)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages + base_extra_packages }}"
    state: present

- name: Install unattended-upgrades (Debian family)
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when:
    - ansible_os_family == "Debian"
    - base_enable_unattended_upgrades | bool

- name: Enable unattended security upgrades (Debian family)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - base_enable_unattended_upgrades | bool
