---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  when: base_manage_hostname | bool

- name: Map hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ base_hostname }}"
  when: base_manage_hostname | bool

- name: Refresh apt cache (Debian family)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages + base_extra_packages }}"
    state: present

- name: Install unattended-upgrades (Debian family)
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when:
    - ansible_os_family == "Debian"
    - base_enable_unattended_upgrades | bool

- name: Enable unattended security upgrades (Debian family)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - base_enable_unattended_upgrades | bool

- name: Install login banner (MOTD)
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
  when: base_motd_enabled | bool

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: base_manage_journald | bool

- name: Configure persistent journald with size cap
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-sysops.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ base_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  when: base_manage_journald | bool
  notify: Restart journald

- name: Configure swap file
  ansible.builtin.include_tasks: swap.yml
  when: base_swap_size_mb | int > 0
