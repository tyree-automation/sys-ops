---
- name: Install and join tailscale
  when: tailscale_enabled | bool
  block:
    - name: Install tailscale (official install script)
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale
        executable: /bin/bash

    - name: Enable and start tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true

    - name: Check tailscale backend state
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Join the tailnet
      ansible.builtin.command: >-
        tailscale up
        --authkey={{ tailscale_authkey }}
        --hostname={{ tailscale_hostname }}
        {{ tailscale_up_args }}
      when:
        - tailscale_authkey | length > 0
        - (tailscale_status.stdout | from_json).BackendState | default('NoState') != 'Running'
      no_log: true
      register: tailscale_up
      changed_when: tailscale_up.rc == 0

    - name: Warn when no auth key was provided
      ansible.builtin.debug:
        msg: >-
          tailscale installed but not joined: set tailscale_authkey
          (Semaphore secret variable or -e) and re-run, or run
          'tailscale up' manually on the host.
      when:
        - tailscale_authkey | length == 0
        - (tailscale_status.stdout | from_json).BackendState | default('NoState') != 'Running'
