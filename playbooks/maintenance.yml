---
# ===========================================================================
# MAINTENANCE — recurring upkeep. Schedule this in Semaphore (e.g. weekly).
#
#   ansible-playbook playbooks/maintenance.yml
#   ansible-playbook playbooks/maintenance.yml -e maintenance_reboot_if_required=true
#
# Updates all packages, removes orphans, cleans caches, vacuums journals,
# reports health, and (optionally) reboots when the OS requires it.
# ===========================================================================
- name: Routine system maintenance
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  serial: "{{ maintenance_serial | default('100%') }}"
  roles:
    - maintenance
