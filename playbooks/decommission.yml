---
# ===========================================================================
# DECOMMISSION — tear a host back down to (near) factory default so it can
# be redeployed or sold off.
#
# SAFETY: refuses to run unless you pass the confirmation token:
#
#   ansible-playbook playbooks/decommission.yml -l web-01 -e decommission_confirm=WIPE
#
# In Semaphore, expose decommission_confirm as a required survey variable so
# the operator must type WIPE on every run.
#
# What it removes/reverts (each step has its own toggle, see role defaults):
#   - Tailscale: logout, uninstall, state + repo files
#   - Security: SSH hardening drop-in, fail2ban, firewall rules
#   - Managed users and their sudoers entries
#   - Base packages installed at onboarding
#   - Logs, shell histories, login records
#   - machine-id (regenerated on next boot — safe to clone/redeploy)
#   - optionally SSH host keys and the ansible user's authorized_keys (LAST)
# ===========================================================================
- name: Decommission server to factory default
  hosts: "{{ target_hosts | default('retiring') }}"
  become: true
  roles:
    - decommission
